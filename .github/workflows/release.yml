# A tag vX.Y.Z (matching pyproject.toml's version) builds the release tarball in the builder container, attests
# its provenance, publishes a GitHub Release with the tarball, its .sha256 and install.sh, then redeploys the
# website so https://useforce.cc/install.sh installs the new version.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches pyproject.toml
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" pyproject.toml \
            || { echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml has $(grep -m1 '^version' pyproject.toml)"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "FORCE_BUILD_ROOT=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          sudo apt-get update -q && sudo apt-get install -yq tmux
          cargo fetch --locked --manifest-path crates/sidebar/Cargo.toml
          cargo fetch --locked --manifest-path crates/intro/Cargo.toml
          python -m pip install -q pytest && python -m pytest -q
      - name: Build the tarball and install.sh
        run: scripts/build-release.sh "$VERSION"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.FORCE_BUILD_ROOT }}/dist/releases/force-${{ env.VERSION }}-linux-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$FORCE_BUILD_ROOT/dist"
          gh release create "$GITHUB_REF_NAME" --title "Force $VERSION" --generate-notes --verify-tag \
            "$d"/releases/force-"$VERSION"-linux-*.tar.gz "$d"/releases/force-"$VERSION"-linux-*.tar.gz.sha256 \
            "$d/install.sh"

  website:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
