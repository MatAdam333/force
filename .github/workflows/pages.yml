# Builds the website (website/) and deploys it to GitHub Pages (useforce.cc), with the install.sh of the latest
# release at its root. Runs on pushes to main that touch the site, by hand, and after every release.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - share/skill.md
      - LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python website/tools/build.py _site
      - name: install.sh of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern install.sh --dir _site; then
            grep -m1 '^VERSION=' _site/install.sh
          else
            echo "::warning::no release yet: the site goes up without install.sh"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
