[package]
name = "force-intro"
version = "0.1.0"
edition = "2021"
description = "Cinematic startup animation for Force: a pre-rendered 3D film and a brand splash played in the terminal"

# crossterm and libc: same versions as crates/sidebar. miniz_oxide (pure Rust, MIT/Zlib/Apache-2.0)
# inflates the embedded film.
[dependencies]
crossterm = "0.29.0"
libc = "0.2"
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
